{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ range .Pages }}
    <section>
      <div class='section-header'>
        <h3><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h3>

        {{ $dateMachine := .Date | time.Format "2006-01-02T15:04:05-07:00" }}
        {{ $dateHuman := .Date | time.Format ":date_long" }}
        <time datetime="{{ $dateMachine }}">{{ $dateHuman }}</time>
      </div>

      <div class='summary'>
        {{ .Summary }}
      </div>
    </section>
  {{ end }}
{{ end }}
